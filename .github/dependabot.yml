version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00" # UTC
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "rattler*"
      # Pinned to =1.4.7 in Cargo.toml until sccache handles `-Tp` on MSVC
      # (https://github.com/mozilla/sccache/issues/2062)
      - dependency-name: "cc"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "crate-ci/typos"
        update-types: ["version-update:semver-patch"]
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
