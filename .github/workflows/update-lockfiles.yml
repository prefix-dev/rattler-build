name: Update lock files

on:
  workflow_dispatch:
  schedule:
    - cron: 0 5 1 * * # Runs at 05:00 on the first day of each month

permissions:
  contents: read

jobs:
  pixi-update:
    permissions:
      contents: read
      id-token: write # Octo STS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rattler-build
            manifest-path: pixi.toml
            lockfile: pixi.lock
            branch: update-pixi
          - name: py-rattler-build
            manifest-path: py-rattler-build/pixi.toml
            lockfile: py-rattler-build/pixi.lock
            branch: update-pixi-py-rattler-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
      - name: Update lock file
        run: |
          set -o pipefail
          pixi update --json --no-install --manifest-path ${{ matrix.manifest-path }} \
            | pixi exec pixi-diff-to-markdown >> diff.md
      # A token from Octo STS (rather than GITHUB_TOKEN) is needed so that the
      # created pull request triggers CI workflows.
      - name: Obtain GitHub app token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: update-lockfiles
      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          commit-message: "chore: update ${{ matrix.name }} pixi lock file"
          title: "chore: update ${{ matrix.name }} pixi lock file"
          body-path: diff.md
          branch: ${{ matrix.branch }}
          base: main
          labels: pixi
          delete-branch: true
          add-paths: ${{ matrix.lockfile }}
