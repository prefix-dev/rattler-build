# Example: explicit `bundle_url` pointing at SLSA build provenance
#
# Besides the immutable-release attestation (see ../uv-attestation), uv's
# release workflow creates SLSA build provenance with
# `actions/attest-build-provenance`. That attestation is signed on the
# Sigstore public-good instance by the workflow identity:
#   identity: https://github.com/astral-sh/uv/.github/workflows/release.yml@refs/heads/main
#   issuer:   https://token.actions.githubusercontent.com
#
# The bundle is fetched from GitHub's attestations API, filtered by the
# artifact's SHA-256 and the provenance predicate. The `@refs/heads/main`
# constraint additionally pins the workflow ref that produced it.

context:
  version: "0.12.1"
  sha256: 5f0503f896f1209f6114835a7754369c2484331b0caab4c1ecd4579dfd2a31b0

package:
  name: uv
  version: ${{ version }}

source:
  url: https://github.com/astral-sh/uv/releases/download/${{ version }}/source.tar.gz
  sha256: ${{ sha256 }}
  attestations:
    bundle_url: https://api.github.com/repos/astral-sh/uv/attestations/sha256:${{ sha256 }}?predicate_type=provenance
    publishers:
      - github:astral-sh/uv@refs/heads/main

build:
  number: 0
  skip:
    - win
  script:
    - cargo install --locked --root "$PREFIX" --path crates/uv

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cmake
    - make

tests:
  - script:
      - uv --version

about:
  homepage: https://github.com/astral-sh/uv
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
  summary: An extremely fast Python package and project manager, written in Rust
  repository: https://github.com/astral-sh/uv
