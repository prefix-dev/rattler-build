[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tingy-rich-demo"
version = "0.1.0"
description = "A tiny Rich application built by a custom rattler-build metadata backend"
requires-python = ">=3.10"
dependencies = ["rich>=13.9,<15"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/prefix-dev/rattler-build"
Repository = "https://github.com/prefix-dev/rattler-build"

[project.scripts]
tingy-rich-demo = "tingy_rich_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tingy_rich_demo"]

# Explicit project overrides augment the backend's small built-in map.
[tool.rattler-build.pypi-to-conda]
rich = "rich"
