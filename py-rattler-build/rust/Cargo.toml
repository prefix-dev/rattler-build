[package]
name = "py-rattler-build"
version = "0.74.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[lib]
name = "rattler_build"
crate-type = ["cdylib"]

[features]
default = ["rustls"]
native-tls = ["rattler-build/native-tls"]
rustls = ["rattler-build/rustls"]

[dependencies]
rattler-build = { path = "../../" }
rattler_build_recipe = { path = "../../crates/rattler_build_recipe" }
rattler_build_jinja = { path = "../../crates/rattler_build_jinja" }
rattler_build_types = { path = "../../crates/rattler_build_types" }
rattler_build_variant_config = { path = "../../crates/rattler_build_variant_config" }
rattler_build_package = { path = "../../crates/rattler_build_package" }
rattler_build_script = { path = "../../crates/rattler_build_script" }
indexmap = "2.14.0"
pyo3 = { version = "0.29.0", features = [
  "abi3-py38",
  "extension-module",
  "multiple-pymethods",
  "jiff-02",
] }
tokio = { version = "1.53.1", features = [
  "rt",
  "macros",
  "rt-multi-thread",
  "process",
] }
rattler_conda_types = "0.52"
rattler_config = "0.7"
rattler_networking = { version = "0.30.3" }
rattler_solve = "9.0"
rattler_virtual_packages = "5.1.0"
clap = "4.6.4"
url = "2.5.8"
jiff = "0.2.35"
hex = "0.4.3"
rattler_upload = "0.10"
rattler_package_streaming = { version = "0.27.0", default-features = false }
miette = "7.6.0"
tempfile = "3.27.0"
serde_yaml = "0.9"
serde_json = "1.0.151"
pythonize = "0.29.0"
thiserror = "2.0.19"
fs-err = "3.3.1"
tracing = "0.1"
tracing-subscriber = "0.3"
indicatif = "0.18"

[build-dependencies]
pyo3-build-config = "0.29.0"

# Prevent package from thinking it's in the workspace
[workspace]
# 'local_dependencies' is generated by maturin and needs to be excluded
exclude = ["local_dependencies/rattler-build"]
