[package]
name = "py-rattler-build"
version = "0.79.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

# Prevent package from thinking it's in the workspace
[workspace]
# 'local_dependencies' is generated by maturin and needs to be excluded
exclude = ["local_dependencies/rattler-build"]

[lib]
crate-type = ["cdylib"]
name = "rattler_build"

[dependencies]
clap = "4.6.6"
fs-err = "3.3.1"
hex = "0.4.3"
indexmap = "2.14.2"
indicatif = "0.18"
jiff = "0.2.35"
miette = "7.6.0"
pyo3 = { version = "0.29.2", features = [
  "abi3-py38",
  "extension-module",
  "jiff-02",
  "multiple-pymethods",
] }
pythonize = "0.29.0"
rattler-build = { path = "../../" }
rattler_build_jinja = { path = "../../crates/rattler_build_jinja" }
rattler_build_package = { path = "../../crates/rattler_build_package" }
rattler_build_recipe = { path = "../../crates/rattler_build_recipe" }
rattler_build_script = { path = "../../crates/rattler_build_script" }
rattler_build_types = { path = "../../crates/rattler_build_types" }
rattler_build_variant_config = { path = "../../crates/rattler_build_variant_config" }
rattler_conda_types = "0.58.0"
rattler_config = "0.10.0"
rattler_networking = { version = "0.34.4" }
rattler_package_streaming = { version = "0.28.0", default-features = false }
rattler_redaction = { version = "0.2.7", default-features = false }
rattler_solve = "12.0.1"
rattler_upload = "0.15.0"
rattler_virtual_packages = "8.1.4"
serde_json = "1.0.151"
serde_yaml = "0.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5.8"

[build-dependencies]
pyo3-build-config = "0.29.2"

[features]
default = ["rustls"]
native-tls = ["rattler-build/native-tls"]
rustls = ["rattler-build/rustls"]
