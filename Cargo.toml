[package]
name = "rattler-build"
version = "0.80.0"
authors = ["rattler-build contributors <hi@prefix.dev>"]
repository = "https://github.com/prefix-dev/rattler-build"
edition = "2024"
license = "BSD-3-Clause"
readme = "README.md"
description = "A fast CLI tool to build conda packages on Windows, macOS and Linux"
documentation = "https://prefix-dev.github.io/rattler-build"
default-run = "rattler-build"
rust-version = "1.98"
publish = true

[workspace]
members = [
  "crates/rattler_build_allocator",
  "crates/rattler_build_core",
  "crates/rattler_build_docs",
  "crates/rattler_build_jinja",
  "crates/rattler_build_networking",
  "crates/rattler_build_package",
  "crates/rattler_build_recipe",
  "crates/rattler_build_recipe_generator",
  "crates/rattler_build_script",
  "crates/rattler_build_source_cache",
  "crates/rattler_build_types",
  "crates/rattler_build_variant_config",
  "crates/rattler_build_yaml_parser",
]
exclude = ["crates/rattler_build_playground"]

[workspace.package]
authors = ["rattler-build contributors <hi@prefix.dev>"]
edition = "2024"
readme = "README.md"
repository = "https://github.com/prefix-dev/rattler-build"
license = "BSD-3-Clause"

[workspace.dependencies]
anyhow = "1.0.104"
arwen-codesign = "0.0.1-alpha.1"
async-once-cell = "0.5.4"
async-recursion = "1.1.1"
async-trait = "0.1"
bzip2 = "0.6.1"
clap = { version = "4.6.6", features = ["derive"] }
console = { version = "0.16.4", features = ["windows-console-colors"] }
content_inspector = "0.2.4"
dashmap = "6.2"
dunce = "1.0.5"
flate2 = "1.1.10"
fs-err = "3.3.1"
futures = "0.3.34"
globset = "0.4.20"
hex = "0.4.3"
indexmap = "2.14.2"
indicatif = "0.18.6"
insta = "1.48.0"
itertools = "0.15.0"
jiff = { version = "0.2.35", features = ["serde"] }
lazy_static = "1.5.0"
libc = "0.2"
line-ending = "1.5.1"
lzma-rust2 = { version = "0.23", features = ["xz"] }
marked-yaml = "0.8.0"
md-5 = "0.11"
memchr = "2.8.3"
memmap2 = "0.9.11"
miette = "7.6.0"
minijinja = { version = "3.0.1", features = [
  "json",
  "serde",
  "unstable_machinery",
] }
minijinja-contrib = { version = "3.0.1", features = ["datetime", "timezone"] }
pathdiff = "0.2.3"
petgraph = { version = "0.8.3", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5.1", features = [
  "json",
] }
reqwest-retry = { package = "astral-reqwest-retry", version = "0.9.1" }
retry-policies = "0.5.2"
rstest = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-value = "0.7.0"
serde_with = "3.22.0"
serde_yaml = "0.9.34"
serial_test = "4.0.1"
sevenz-rust2 = "0.24.0"
sha1 = { version = "0.11.0" }
sha2 = "0.11"
spdx = "0.13.5"
strsim = "0.11.1"
strum = "0.28.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tokio-util = { version = "0.7.19", features = ["codec", "compat"] }
toml = "1.1.5"
tracing = "0.1.44"
unicode-normalization = "0.1.25"
url = "2.5.8"
urlencoding = "2.1"
walkdir = "2.5.0"
which = "8.0.6"
windows-sys = "0.61"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
zstd = "0.14.0"

# Dependencies used in subcrates (workspace-level)
clap-verbosity-flag = "3.0.4"
comfy-table = "8.0.0"
flickzeug = "0.6.0"
goblin = "0.10.7"
ignore = "0.4.33"
num_cpus = "1.17.0"
pretty_assertions = "1.4.1"
reflink-copy = "0.1.30"
scroll = "0.13.0"
serde-untagged = "0.1.9"
terminal_size = "0.4.4"
text-stub-library = "0.9.0"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3", features = [
  "ansi",
  "env-filter",
  "fmt",
  "json",
] }
tracing-test = "0.2.6"

# Rattler crates
rattler_conda_types = { version = "0.58.0", default-features = false }
rattler_digest = { version = "2.1", default-features = false, features = [
  "serde",
] }
rattler_git = { version = "0.3.16" }
rattler_networking = { version = "0.34.4", default-features = false }
rattler_package_streaming = { version = "0.28.0", default-features = false }
rattler_prefix_guard = { version = "0.1.2" }
rattler_shell = { version = "0.29.6", default-features = false, features = [
  "sysinfo",
] }

rattler = { version = "0.55.2", default-features = false, features = [
  "cli-tools",
  "indicatif",
] }
rattler_cache = { version = "0.11.0", default-features = false }
rattler_config = { version = "0.10.0" }
rattler_index = { version = "0.34.2", default-features = false }
rattler_menuinst = "0.4.6"
rattler_redaction = { version = "0.2.7", default-features = false }
rattler_repodata_gateway = { version = "0.37.1", default-features = false, features = [
  "gateway",
] }
rattler_s3 = { version = "0.4.2" }
rattler_solve = { version = "12.0.1", default-features = false, features = [
  "resolvo",
  "serde",
] }
rattler_upload = { version = "0.15.0", default-features = false }
rattler_virtual_packages = { version = "8.1.4", default-features = false }

# Internal rattler-build crates
rattler_build_allocator = { path = "crates/rattler_build_allocator", version = "=0.1.3" }
rattler_build_core = { path = "crates/rattler_build_core", version = "=0.2.22", default-features = false }
rattler_build_jinja = { path = "crates/rattler_build_jinja", version = "=0.1.23" }
rattler_build_networking = { path = "crates/rattler_build_networking", version = "=0.1.18" }
rattler_build_recipe = { path = "crates/rattler_build_recipe", version = "=0.1.23" }
rattler_build_recipe_generator = { path = "crates/rattler_build_recipe_generator", version = "=0.1.20", default-features = false }
rattler_build_script = { path = "crates/rattler_build_script", version = "=0.2.18", default-features = false }
rattler_build_source_cache = { path = "crates/rattler_build_source_cache", version = "=0.1.20", default-features = false }
rattler_build_types = { path = "crates/rattler_build_types", version = "=0.1.21" }
rattler_build_variant_config = { path = "crates/rattler_build_variant_config", version = "=0.1.23" }
rattler_build_yaml_parser = { path = "crates/rattler_build_yaml_parser", version = "=0.1.23" }

[[bin]]
name = "rattler-build"
required-features = ["recipe-generation"]

[[bin]]
name = "patch-apply-gen-test-data"
path = "./scripts/patch-apply-gen-test-data.rs"

[[bench]]
harness = false
name = "parse_file"

[dependencies]
anyhow = { workspace = true }
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
async_http_range_reader = { package = "astral_async_http_range_reader", version = "0.12.0" }
async_zip = { package = "astral_async_zip", version = "0.0.22", features = [
  "tokio",
  "zstd",
] }
clap = { workspace = true, features = ["cargo", "env", "suggestions"] }
clap_complete = "4.6.9"
clap_complete_nushell = "4.6.2"
clap-verbosity-flag = { workspace = true }
comfy-table = { workspace = true }
console = { workspace = true }
dialoguer = "0.12.0"
dunce = { workspace = true }
fs-err = { workspace = true }
futures = { workspace = true }
globset = { workspace = true }
hex = { workspace = true }
http = "1"
ignore = { workspace = true }
indexmap = { workspace = true }
jiff = { workspace = true }
memmap2 = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
minijinja = { workspace = true }
num_cpus = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
reqwest-middleware = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "time",
] }
tokio_tar = { package = "astral-tokio-tar", version = "0.7", default-features = false }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

# Rattler crates
rattler = { workspace = true }
rattler_conda_types = { workspace = true, features = ["rayon"] }
rattler_config = { workspace = true }
rattler_digest = { workspace = true }
rattler_index = { workspace = true }
rattler_networking = { workspace = true, features = ["rattler_config"] }
rattler_package_streaming = { workspace = true, default-features = false }
rattler_repodata_gateway = { workspace = true }
rattler_solve = { workspace = true }
rattler_upload = { workspace = true }
rattler_virtual_packages = { workspace = true }

rattler_build_allocator = { workspace = true, optional = true }
# Local rattler-build crates
rattler_build_core = { workspace = true }
rattler_build_recipe = { workspace = true, features = ["variant-config"] }
rattler_build_recipe_generator = { workspace = true, features = [
  "cli",
], optional = true }
rattler_build_script = { workspace = true, features = ["execution"] }
rattler_build_types = { workspace = true }
rattler_build_variant_config = { workspace = true, features = ["parser"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { workspace = true, features = ["filters", "yaml"] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
serial_test = { workspace = true }
tracing-indicatif = "0.3"
tracing-test = { workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

# cc >= 1.5.0 passes `-Tp` as a separate argument for `.cc` sources on MSVC (https://github.com/rust-lang/cc-rs/pull/1930), which sccache does not support and breaks the mimalloc build (https://github.com/mozilla/sccache/issues/2062).
[target."cfg(windows)".dependencies]
cc = "=1.4.7"

[features]
default = ["recipe-generation", "rustls", "s3", "sigstore"]
native-tls = [
  "rattler_build_core/native-tls",
  "rattler_build_recipe_generator?/native-tls",
]
patch-test-extra = []
# Enable optimized memory allocators for release builds.
# This provides significant performance improvements, especially on Linux musl.
# Disabled by default due to increased compile time.
performance = ["rattler_build_allocator"]
recipe-generation = ["rattler_build_recipe_generator"]
rustls = ["rattler_build_core/rustls", "rattler_build_recipe_generator?/rustls"]
s3 = ["rattler_build_core/s3"]
sigstore = ["rattler_build_core/sigstore"]
