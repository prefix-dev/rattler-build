context:
  version: "1.0.0"

recipe:
  name: repro
  version: ${{ version }}

build:
  number: 0

outputs:
  - package:
      name: repro-exporter
    build:
      script: echo "exporter built"
    requirements:
      run_exports:
        strong:
          - repro-runtime ==${{ version }}

  - package:
      name: repro-direct
    build:
      script: echo "direct dependency built"
    requirements:
      run:
        - repro-exporter ==${{ version }}

  - package:
      name: repro-consumer
    build:
      script: echo "consumer built"
    requirements:
      build:
        - repro-direct ==${{ version }}

  - package:
      name: repro-runtime
    build:
      script: echo "runtime built"
    requirements:
      host:
        - repro-consumer ==${{ version }}
