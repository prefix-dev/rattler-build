schema_version: 1

package:
  name: metadata-step-example
  version: 1.0.0

source:
  path: .

build:
  metadata:
    requirements:
      build: [python]
    env:
      # Executor-owned protocol variables must override recipe values.
      OUTPUT_FILE: should-not-be-used.txt
      SRC_DIR: should-not-be-used
    interpreter: python
    run: |
      import json
      import os
      import pathlib
      import tomllib

      project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
      dynamic = project["tool"]["rattler-build"]
      install = {
          "name": "install",
          "interpreter": "python",
          "run": "import os; from pathlib import Path; p = Path(os.environ['PREFIX']) / 'share' / 'metadata-step-example'; p.mkdir(parents=True, exist_ok=True); (p / 'generated.txt').write_text('generated by metadata step\\n')",
      }
      with open(os.environ["OUTPUT_FILE"], "w") as output:
          output.write(f"requirements.build.append {json.dumps(dynamic['build'])}\n")
          output.write(f"requirements.host.append {json.dumps(dynamic['host'])}\n")
          output.write(f"build.steps {json.dumps([install])}\n")

about:
  summary: Build and host requirements plus build steps generated before solving
  license: BSD-3-Clause

tests:
  - package_contents:
      files:
        - share/metadata-step-example/generated.txt
