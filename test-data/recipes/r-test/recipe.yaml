package:
  name: r-test
  version: 0.1.0

build:
  number: 0
  script:
    interpreter: rscript
    content: |
      print("Testing R Interpreter", quote = FALSE)

      # Create test data and output file
      test_data <- data.frame(
        name = c("package1", "package2"),
        version = c("1.0", "2.0")
      )

      # Load and use ggplot2
      library(ggplot2)
      p <- ggplot(test_data, aes(x = name, y = as.numeric(version))) +
        geom_bar(stat = "identity")

      # Create output file
      output_file <- file.path(Sys.getenv("PREFIX"), "r-test-output.txt")
      writeLines(c(
        "This file was created by the R interpreter in rattler-build",
        "R test successful",
        paste("R version:", R.version.string),
        paste("PREFIX:", Sys.getenv("PREFIX"))
      ), output_file)

requirements:
  host:
    - r-base
    - r-ggplot2
    # TODO(2026-08-24): drop once conda-forge's 2026-08-21 mingw runtime
    # rebuild (*_3) is fixed; executables crash at startup with
    # "stack smashing detected" / 0xC0000409 under it, taking Rscript down
    # with them. See conda-forge/m2w64-sysroot-feedstock issue 23.
    # The *_2 builds are the last good ones.
    - if: win
      then:
        - libgcc ==16.1.0 h110b43a_2
        - libgomp ==16.1.0 h8ee18e1_2
        - libgfortran5 ==16.1.0 h94075d5_2
  run:
    - r-base
    - r-ggplot2
    # TODO(2026-08-24): drop once conda-forge's 2026-08-21 mingw runtime
    # rebuild (*_3) is fixed; executables crash at startup with
    # "stack smashing detected" / 0xC0000409 under it, taking Rscript down
    # with them. See conda-forge/m2w64-sysroot-feedstock issue 23.
    # The *_2 builds are the last good ones.
    - if: win
      then:
        - libgcc ==16.1.0 h110b43a_2
        - libgomp ==16.1.0 h8ee18e1_2
        - libgfortran5 ==16.1.0 h94075d5_2

tests:
  - r:
      libraries:
        - ggplot2
