schema_version: 1

recipe:
  name: flag-exports
  version: 1.0.0

build:
  noarch: generic

outputs:
  - package:
      name: debug-toolchain
    build:
      flags:
        - toolchain
    requirements:
      flag_exports:
        - debug
        - sanitizers

  # Exports different flags depending on the environment it is used from.
  - package:
      name: split-toolchain
    requirements:
      flag_exports:
        from_build:
          - built_with_split
        from_host:
          - linked_with_split

  - package:
      name: split-consumer-build
    requirements:
      build:
        - split-toolchain

  - package:
      name: split-consumer-host
    requirements:
      host:
        - split-toolchain

  - package:
      name: flag-consumer
    build:
      flags:
        - cuda
    requirements:
      build:
        - debug-toolchain

  - package:
      name: flag-consumer-ignore-by-name
    requirements:
      build:
        - debug-toolchain
      ignore_flag_exports:
        by_name:
          - sanitizers

  - package:
      name: flag-consumer-ignore-from-package
    requirements:
      host:
        - debug-toolchain
      ignore_flag_exports:
        from_package:
          - debug-toolchain
