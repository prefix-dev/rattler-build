[package]
name = "rattler_build_networking"
version = "0.1.17"
authors.workspace = true
edition.workspace = true
description = "Networking utilities for rattler-build, providing shared HTTP client functionality with retry middleware"
readme = "README.md"
repository.workspace = true
license.workspace = true

[dependencies]
rattler_networking = { workspace = true, default-features = false }
reqwest = { workspace = true, features = ["multipart"] }
reqwest-middleware = { workspace = true }
reqwest-retry = { workspace = true }
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[features]
default = []
native-tls = ["rattler_networking/native-tls", "reqwest/native-tls"]
rustls = [
  "rattler_networking/rustls",
  "reqwest-middleware/rustls",
  "reqwest/rustls",
]
s3 = ["rattler_networking/s3"]
