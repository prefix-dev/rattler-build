[package]
name = "rattler_build_yaml_parser"
version = "0.1.22"
edition.workspace = true
description = "YAML parser with Jinja2 template support for rattler-build, providing shared parsing infrastructure for conditional structures and template values"
readme = "README.md"
repository.workspace = true
license.workspace = true

[dependencies]
marked-yaml = { workspace = true }
miette = { workspace = true }
rattler_build_jinja = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
