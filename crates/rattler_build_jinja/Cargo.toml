[package]
name = "rattler_build_jinja"
version = "0.1.24"
authors.workspace = true
edition.workspace = true
description = "Jinja template engine integration for rattler-build, powered by minijinja"
readme = "README.md"
repository.workspace = true
license.workspace = true

[dependencies]
indexmap = { workspace = true }
itertools = { workspace = true }
lazy_static = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true, features = ["datetime", "timezone"] }
rattler_build_types = { workspace = true }
rattler_conda_types = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
serde_yaml = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
insta = { workspace = true, features = ["yaml"] }
tempfile = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs-err = { workspace = true }
toml = { workspace = true }

[features]
