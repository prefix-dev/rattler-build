rules:
  artipacked:
    ignore:
      # docs workflow needs git credentials for mike deploy --push
      - docs.yml
      # tag-release job needs git credentials to push tags
      - release-artifacts.yml
  self-repository:
    ignore:
      # GitHub and actionlint require the ./ syntax for local reusable workflows.
      - python-release.yml
      - release-artifacts.yml
